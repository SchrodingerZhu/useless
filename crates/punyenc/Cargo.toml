[package]
name = "punyenc"
version = "0.1.1"
edition = "2024"
authors = ["schrodingerzhu <yifanzhu@rochester.edu>"]
description = "Punycode encoding with a Fenwick tree in O(n log n) time"
license = "MIT OR Apache-2.0"
keywords = ["punycode", "unicode", "encoding", "fenwick"]
categories = ["encoding", "text-processing"]
repository = "https://github.com/schrodingerzhu/useless"
readme = "README.md"

[dependencies]
ftree = "1.3.0"

[[bench]]
name = "encode"
harness = false

[dev-dependencies]
criterion = "0.8.2"
punycode = "0.4.1"
idna = "1.1.0"
punycode-rs = "0.1.0"
